<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Printer enclosure frame (Bambu-style cube) -->
  <rect x="6" y="6" width="36" height="36" rx="2"
        fill="none" stroke="#52a441" stroke-width="3"
        stroke-linejoin="round"/>

  <!-- Top gantry rail -->
  <rect x="8" y="12" width="32" height="3" fill="#52a441"/>

  <!-- Print head hanging from gantry -->
  <rect x="21" y="15" width="6" height="6" fill="#3d7d31"/>
  <path d="M22 21 L26 21 L25 24 L23 24 Z" fill="#74fe00"/>

  <!-- Print bed -->
  <rect x="9" y="34" width="30" height="3" fill="#52a441"/>

  <!-- Partially printed object on the bed -->
  <rect x="20" y="27" width="8" height="7" fill="#74fe00"/>
</svg>
